{% set version = "3.0.5" %}
{% set name = "pywinpty" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 61db0db063de9865adbea66db294628f8577f608d9764a4c7d3384eeacc4e81b
    folder: pywinpty-src
    patches:
      # PyPI's build.rs vendors ConPTY from NuGet; this build links the conda
      # `conpty` package instead, so skip that download.
      - patches/skip-pywinpty-nuget.patch
      - patches/use_local_winpty-rs.patch

  # winpty-rs: vendored so that ConPTY can link against the conda conpty package
  - url: https://github.com/andfoy/winpty-rs/archive/refs/tags/v1.0.6.tar.gz
    sha256: ac15210cbfd52f44fb66b6f9ad59466eeb46e5d6997cb6769e72d68d13f1dda6
    folder: winpty-rs-src
    patches:
      # Build ConPTY against the conpty.dll/OpenConsole.exe from conda's
      # `conpty` package instead of downloading them from NuGet.
      - patches/winpty-rs_use_conda_conpty.patch

build:
  number: 0
  skip: true  # [(not win) or py<310]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.1,<2.0
    # WinPTY backend library and ConPTY binaries (conpty.dll/OpenConsole.exe)
    - winpty 0.4.3
    - conpty
  run:
    - python
    # Required for the WinPTY backend
    - {{ pin_compatible('winpty') }}
    # Required for the ConPTY backend
    - {{ pin_compatible('conpty') }}

test:
  imports:
    - winpty
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # recipe/run_test.py exercises both the ConPTY and WinPTY backends
    # (Unicode I/O, child-observed resize, exit status) with non-blocking
    # reads. pywinpty's upstream pytest suite is not run: its blocking
    # pty.read() calls hang intermittently on Windows on ARM.

about:
  home: https://github.com/andfoy/pywinpty
  license: MIT
  license_file:
    - pywinpty-src/LICENSE.txt
    - THIRDPARTY.yml
  license_family: MIT
  summary: Pseudoterminals for Windows in Python
  description: |
    PyWinpty allows creating and communicating with Windows processes that
    receive input and print outputs via console input and output pipes.
    WinPTY backend is supported.
  doc_url: https://github.com/andfoy/pywinpty
  dev_url: https://github.com/andfoy/pywinpty

extra:
  recipe-maintainers:
    - blink1073
    - ccordoba12
    - andfoy
    - ocefpaf
